name: Run conda-lock to update dependencies

# Disable default permissions and grant minimal required permissions
permissions: {}

on:
  workflow_dispatch:
  schedule:
  # At 5:28am UTC Monday and Thursday
  - cron: 28 5 * * MON,THU

jobs:
  create-lockfiles:
    name: create-lockfiles
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.14" ]

    # Don't run scheduled job on forks. Ref: <https://github.com/orgs/community/discussions/26684#discussioncomment-3252843>
    if: (github.event_name == 'schedule' && github.repository == 'conda/conda-lock') || (github.event_name != 'schedule')
    defaults:
      run:
        # Ensure the environment is activated
        # <https://github.com/mamba-org/provision-with-micromamba#important>
        shell: bash -l {0}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # for uploading artifacts
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Install Micromamba
      uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
      with:
        environment-file: environments/conda-lock.yml
        environment-name: conda-lock-dev

    - name: Install conda-lock from branch
      run: pip install --editable .

    - name: Run conda-lock to recreate lockfile from scratch
      run: |
        export PYTHON_VERSION=${PY_VER}
        source scripts/update_lockfile.sh
      env:
        PY_VER: ${{ matrix.python-version }}

    - name: Upload lockfile
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: conda-lock-python-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: environments/conda-lock-python-${{ matrix.python-version }}.yaml

  update-pixi:
    name: update-pixi
    if: (github.event_name == 'schedule' && github.repository == 'conda/conda-lock') || (github.event_name != 'schedule')
    defaults:
      run:
        # Ensure the environment is activated
        # <https://github.com/mamba-org/provision-with-micromamba#important>
        shell: bash -l {0}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # for uploading artifacts
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - name: Install Micromamba
      uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462 # v2.0.7
      with:
        environment-file: environments/conda-lock.yml
        environment-name: conda-lock-dev

    - name: Install pixi
      run: micromamba install pixi --yes

    - name: Install conda-lock from branch
      run: pip install --editable .

    - name: Run conda-lock to recreate lockfile from scratch
      run: |
        source scripts/generate_pixi.sh

    - name: Upload pixi.toml
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: pixi.toml-${{ github.run_id }}-${{ github.run_attempt }}
        path: pixi.toml

    - name: Upload pixi.lock
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: pixi.lock-${{ github.run_id }}-${{ github.run_attempt }}
        path: pixi.lock

  create-pr:
    name: create-pr
    needs:
      - create-lockfiles
      - update-pixi
    runs-on: ubuntu-latest
    permissions:
      contents: write     # for creating pull requests
      pull-requests: write # for creating pull requests
      actions: read       # for downloading artifacts
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false

    - name: Download all lockfiles
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: conda-lock-python-*-${{ github.run_id }}-${{ github.run_attempt }}
        path: environments/
        merge-multiple: true

    - name: Download all pixi files
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        pattern: pixi.*-${{ github.run_id }}-${{ github.run_attempt }}
        path: .
        merge-multiple: true

    - name: Open a pull request
      env:
        # The default GITHUB_TOKEN doesn't allow other workflows to trigger.
        # Thus if there are tests to be run, they won't be run. For more info,
        # see <https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow>.
        # One possible workaround is to specify a Personal Access Token (PAT).
        # This PAT should have read-write permissions for "Pull Requests"
        # and read-write permissions for "Contents".
        GH_TOKEN: ${{ secrets.GH_PAT_FOR_PR_2 }}
        BRANCH: relock-deps
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        # The checkout doesn't persist credentials, so let git push with GH_TOKEN.
        gh auth setup-git

        git add --all
        if git diff --cached --quiet; then
          echo "Dependencies are already up to date."
          # Delete a stale branch so that any open pull request for it gets closed.
          if git ls-remote --exit-code --heads origin "${BRANCH}" > /dev/null; then
            git push origin --delete "${BRANCH}"
          fi
          exit 0
        fi

        git commit --message "Relock dependencies"
        git push --force origin "HEAD:refs/heads/${BRANCH}"

        existing_pr=$(gh pr list --repo "${GITHUB_REPOSITORY}" --head "${BRANCH}" --base "${GITHUB_REF_NAME}" --state open --json number --jq '.[].number')
        if [[ -n "${existing_pr}" ]]; then
          echo "Updated the existing pull request #${existing_pr}."
        else
          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${GITHUB_REF_NAME}" \
            --head "${BRANCH}" \
            --title "Relock dependencies" \
            --body "This pull request relocks the dependencies with conda-lock. It is triggered by [update-lockfile](https://github.com/conda/conda-lock/blob/main/.github/workflows/update-lockfile.yaml)." \
            --label conda-lock
        fi
